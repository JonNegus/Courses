<!DOCTYPE html>
<html lang="fr" x-data="shoppingApp()">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liste de Courses</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07080a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://fav.farm/🛒">

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/theme-expedition33.css">

  <!-- Scripts Libs -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Scripts App Engine & Thèmes -->
  <script src="js/theme-engine.js"></script>
  <script src="js/theme-expedition33.js"></script>
</head>

<body class="p-4 pb-32" data-theme="expedition33">

  <canvas id="fx-canvas" class="fixed inset-0 pointer-events-none z-[100]"></canvas>

  <div class="max-w-md mx-auto flex justify-between items-center my-4 relative">
    <h1 class="text-2xl font-bold flex-1 text-center tracking-widest drop-shadow-md">
      EXPÉDITION 33
    </h1>
  </div>

  <!-- Liste d'articles -->
  <ul id="shopping-list" class="space-y-3 max-w-md mx-auto transition-opacity duration-300">
    <template x-for="(item, index) in items" :key="item.id">
      <li :id="'item-' + item.id" class="p-4 flex items-center justify-between border active:scale-95 transition-all duration-300">
        
        <div class="flex items-center gap-3 flex-1 cursor-pointer" @click="toggleItem(index)">
          <span class="drag-handle opacity-40 cursor-grab text-lg">☰</span>
          <span class="text-lg font-medium transition-all duration-300" 
                :class="{ 'item-checked': item.checked }" 
                x-text="item.name"></span>
        </div>

        <div class="flex items-center gap-2">
          <button @click="openSinglePriceModal(index)" 
                  class="px-3 py-1.5 rounded-md font-bold text-sm active:scale-95 transition-all border"
                  style="background-color: rgba(7, 8, 10, 0.6); color: var(--accent-price); border-color: rgba(102, 252, 241, 0.3)">
            <span x-text="item.price ? item.price + ' XPF' : '🪙 Prix'"></span>
          </button>
          <button @click="deleteItem(index)" 
                  class="p-2 rounded-md active:scale-95 transition-all"
                  style="color: var(--danger-color)">🗑️</button>
        </div>
      </li>
    </template>
  </ul>

  <!-- Toast -->
  <div x-show="toast.show" class="fixed bottom-24 left-1/2 -translate-x-1/2 px-5 py-3 rounded-md shadow-2xl flex items-center gap-4 z-50 text-sm border" style="background-color: var(--bg-card); border-color: var(--border-color)">
    <span x-text="toast.message"></span>
    <button @click="undoLastAction()" class="px-3 py-1 rounded font-semibold text-xs text-black" style="background-color: var(--accent-color)">↩️ Annuler</button>
  </div>

  <!-- Footer Actions (Escarcelle) -->
  <div class="fixed bottom-0 left-0 right-0 p-4 footer-escarcelle flex justify-between items-center max-w-md mx-auto z-40">
    <div>
      <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Escarcelle Total</div>
      <div class="text-xl font-black tracking-wider" style="color: var(--text-main)" x-text="total + ' XPF'"></div>
    </div>
    <div class="flex gap-2">
      <button @click="clearChecked()" class="text-white px-4 py-2.5 rounded font-semibold shadow-md active:scale-95 transition-all text-sm border" style="background-color: var(--danger-color); border-color: rgba(230, 57, 70, 0.5)">Purger</button>
      <button @click="openAddModal()" class="text-black px-5 py-2.5 rounded font-semibold shadow-md active:scale-95 transition-all text-sm flex items-center gap-1" style="background-color: var(--accent-color)"><span>+</span> Ajouter</button>
    </div>
  </div>

  <!-- Modal Dynamique (Ajout & Edition Prix) -->
  <div x-show="modal.show" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4" @click.self="modal.show = false">
    <div class="p-6 w-full max-w-sm rounded-lg border shadow-2xl space-y-4" style="background-color: #0d1017; border-color: var(--border-color)">
      <h3 class="text-lg font-bold tracking-wide" style="color: var(--text-main)" x-text="modal.mode === 'add' ? 'Ajouter un artefact' : 'Ajuster la valeur'"></h3>
      
      <template x-if="modal.mode === 'add'">
        <input type="text" x-model="forms.addName" @keydown.enter="confirmModal()" placeholder="Nom du produit..." class="w-full bg-black/50 border p-3 rounded text-white focus:outline-none" style="border-color: var(--border-color)">
      </template>
      
      <input type="number" x-model="forms.priceValue" @keydown.enter="confirmModal()" placeholder="Prix en XPF..." class="w-full bg-black/50 border p-3 rounded text-white focus:outline-none" style="border-color: var(--border-color)">
      
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modal.show = false" class="px-4 py-2 text-slate-400 text-sm">Annuler</button>
        <button @click="confirmModal()" class="px-5 py-2 rounded text-black font-semibold text-sm" style="background-color: var(--accent-color)">Valider</button>
      </div>
    </div>
  </div>

  <script>
    function shoppingApp() {
      const rawData = JSON.parse(localStorage.getItem('shoppingList')) || [
        { id: 1, name: 'Pommes d\'or', price: 250, checked: false },
        { id: 2, name: 'Elixir de soin', price: 500, checked: true }
      ];

      return {
        items: rawData,
        lastHistory: null,
        toast: { show: false, message: '', timeout: null },
        modal: { show: false, mode: 'add', editIndex: null },
        forms: { addName: '', priceValue: '' },

        init() {
          window.ThemeEngine.init('fx-canvas');
          window.ThemeEngine.setTheme('expedition33');

          this.$watch('items', val => {
            localStorage.setItem('shoppingList', JSON.stringify(val));
          });

          this.$nextTick(() => {
            new Sortable(document.getElementById('shopping-list'), {
              handle: '.drag-handle',
              animation: 200,
              onEnd: (evt) => {
                const moved = this.items.splice(evt.oldIndex, 1)[0];
                this.items.splice(evt.newIndex, 0, moved);
              }
            });
          });
        },

        get total() {
          return this.items.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
        },

        dispatchThemeEvent(eventName, payload) {
          window.dispatchEvent(new CustomEvent(`app:${eventName}`, { detail: payload }));
        },

        toggleItem(index) {
          this.items[index].checked = !this.items[index].checked;
          this.dispatchThemeEvent('item-toggled', { checked: this.items[index].checked });
        },

        openAddModal() {
          this.modal.mode = 'add';
          this.forms.addName = '';
          this.forms.priceValue = '';
          this.modal.show = true;
        },

        openSinglePriceModal(index) {
          this.modal.mode = 'price';
          this.modal.editIndex = index;
          this.forms.priceValue = this.items[index].price || '';
          this.modal.show = true;
        },

        confirmModal() {
          if (this.modal.mode === 'add') {
            if (!this.forms.addName.trim()) return;
            const oldTotal = this.total;
            const price = Number(this.forms.priceValue) || 0;
            
            this.items.push({
              id: Date.now(),
              name: this.forms.addName.trim(),
              price: price,
              checked: false
            });

            this.modal.show = false;
            const delta = this.total - oldTotal;
            this.dispatchThemeEvent('total-changed', { delta });

          } else if (this.modal.mode === 'price') {
            const index = this.modal.editIndex;
            const oldTotal = this.total;
            const newPrice = Number(this.forms.priceValue) || 0;
            
            this.items[index].price = newPrice;
            this.modal.show = false;

            const el = document.getElementById('item-' + this.items[index].id);
            const buttonEl = el ? el.querySelector('button') : null;

            this.dispatchThemeEvent('price-updated', { 
              element: buttonEl,
              delta: this.total - oldTotal 
            });
          }
        },

        deleteItem(index) {
          const itemToDelete = this.items[index];
          const el = document.getElementById('item-' + itemToDelete.id);
          this.lastHistory = { type: 'single', item: { ...itemToDelete }, index };

          this.dispatchThemeEvent('item-deleting', {
            element: el,
            done: () => {
              const idx = this.items.findIndex(i => i.id === itemToDelete.id);
              if (idx !== -1) this.items.splice(idx, 1);
            }
          });

          this.showToast(`Artefact "${itemToDelete.name}" détruit`);
        },

        clearChecked() {
          const checked = this.items.filter(i => i.checked);
          if (checked.length === 0) return;

          this.lastHistory = { type: 'clean', items: JSON.parse(JSON.stringify(this.items)) };
          const elements = checked.map(item => ({ id: item.id, el: document.getElementById('item-' + item.id) }));

          this.dispatchThemeEvent('items-clearing', {
            items: elements,
            done: () => {
              this.items = this.items.filter(i => !i.checked);
            }
          });

          this.showToast(`${checked.length} artefact(s) purgé(s)`);
        },

        undoLastAction() {
          if (!this.lastHistory) return;
          if (this.lastHistory.type === 'single') {
            this.items.splice(this.lastHistory.index, 0, this.lastHistory.item);
          } else if (this.lastHistory.type === 'clean') {
            this.items = JSON.parse(JSON.stringify(this.lastHistory.items));
          }
          this.dispatchThemeEvent('action-undone');
          this.lastHistory = null;
          this.toast.show = false;
        },

        showToast(msg) {
          this.toast.message = msg;
          this.toast.show = true;
          if (this.toast.timeout) clearTimeout(this.toast.timeout);
          this.toast.timeout = setTimeout(() => this.toast.show = false, 3500);
        }
      }
    }
  </script>
</body>
</html>
